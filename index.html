<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>キッズブロック崩し</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(#87CEEB,#E0F6FF);
    font-family:sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#ui{
    position:absolute;
    top:10px;
    left:0;
    width:100%;
    text-align:center;
    color:#333;
    font-size:24px;
    font-weight:bold;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:25px;
    border-radius:20px;
    text-align:center;
    display:none;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

#startText{
    position:absolute;
    top:60%;
    width:100%;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#ff6600;
}

button{
    font-size:24px;
    padding:10px 20px;
    border:none;
    border-radius:12px;
    background:#ff8c42;
    color:white;
}
</style>
</head>
<body>

<div id="ui">
⭐ スコア: <span id="score">0</span>
❤️ <span id="lives">3</span>
</div>

<div id="startText">👇 タップしてスタート 👇</div>

<div id="message">
<h2 id="result"></h2>
<button onclick="restart()">もういちど</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let w,h;

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    w = canvas.width;
    h = canvas.height;
}
resize();
window.addEventListener("resize",resize);

let paddle, ball, bricks, score, lives;
let ballAttached = true;
let running = true;

function init(){

score=0;
lives=3;

paddle={
    width:w*0.28,
    height:18,
    x:w/2,
    y:h-80
};

ball={
    x:w/2,
    y:h-130,
    r:12,
    dx:2,
    dy:-2
};

bricks=[];

const rows=5;
const cols=5;

const bw=w*0.16;
const bh=30;

const colors=[
"#FF6B6B",
"#FFD93D",
"#6BCB77",
"#4D96FF",
"#B983FF"
];

for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
        bricks.push({
            x:20+c*(bw+10),
            y:100+r*(bh+10),
            w:bw,
            h:bh,
            color:colors[r]
        });
    }
}

ballAttached = true;

document.getElementById("score").textContent=score;
document.getElementById("lives").textContent=lives;
document.getElementById("message").style.display="none";
document.getElementById("startText").style.display="block";
}

init();

let touchX=w/2;

canvas.addEventListener("touchmove",e=>{
    touchX=e.touches[0].clientX;
});

canvas.addEventListener("mousemove",e=>{
    touchX=e.clientX;
});

function startBall(){
    if(ballAttached){
        ballAttached=false;
        document.getElementById("startText").style.display="none";
    }
}

canvas.addEventListener("touchstart",startBall);
canvas.addEventListener("mousedown",startBall);

function drawPaddle(){
    ctx.fillStyle="#FF8C42";
    ctx.fillRect(
        paddle.x-paddle.width/2,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

function drawBall(){
    ctx.fillStyle="#FF3366";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();
}

function drawBricks(){
    bricks.forEach(b=>{
        ctx.fillStyle=b.color;
        ctx.fillRect(b.x,b.y,b.w,b.h);
    });
}

function gameOver(text){
    document.getElementById("result").textContent=text;
    document.getElementById("message").style.display="block";
    running=false;
}

function restart(){
    running=true;
    init();
    requestAnimationFrame(loop);
}

function update(){

paddle.x += (touchX-paddle.x)*0.2;

if(ballAttached){
    ball.x=paddle.x;
    ball.y=paddle.y-20;
    return;
}

ball.x += ball.dx;
ball.y += ball.dy;

if(ball.x<ball.r || ball.x>w-ball.r){
    ball.dx *= -1;
}

if(ball.y<ball.r){
    ball.dy *= -1;
}

if(
    ball.y+ball.r>paddle.y &&
    ball.x>paddle.x-paddle.width/2 &&
    ball.x<paddle.x+paddle.width/2 &&
    ball.dy>0
){
    ball.dy=-Math.abs(ball.dy);

    let hit=(ball.x-paddle.x)/(paddle.width/2);
    ball.dx=hit*4;
}

for(let i=bricks.length-1;i>=0;i--){

    const b=bricks[i];

    if(
        ball.x>b.x &&
        ball.x<b.x+b.w &&
        ball.y>b.y &&
        ball.y<b.y+b.h
    ){
        bricks.splice(i,1);
        ball.dy*=-1;

        score+=10;
        document.getElementById("score").textContent=score;
    }
}

if(bricks.length===0){
    gameOver("🎉 クリア！");
}

if(ball.y>h){

    lives--;

    document.getElementById("lives").textContent=lives;

    if(lives<=0){
        gameOver("😢 ゲームオーバー");
        return;
    }

    ball.dx=2;
    ball.dy=-2;
    ballAttached=true;

    document.getElementById("startText").style.display="block";
}
}

function draw(){

ctx.clearRect(0,0,w,h);

drawBricks();
drawPaddle();
drawBall();
}

function loop(){

if(!running) return;

update();
draw();

requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
